name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: workerd version, without the leading v
        required: true
        default: 1.20261103.1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      VERSION: ${{ inputs.version || '1.20261103.1' }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/checkout@v4
        with:
          repository: cloudflare/workerd
          ref: v${{ env.VERSION }}
          show-progress: false

      - name: Install bazelisk
        run: |
          command -v bazel || {
            sudo curl -fsSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-arm64
            sudo chmod +x /usr/local/bin/bazel
          }
          bazel --version

      - uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-${{ env.VERSION }}-${{ github.run_id }}
          restore-keys: bazel-${{ env.VERSION }}-

      - name: Build workerd without tcmalloc
        run: |
          bazel build --disk_cache=$HOME/bazel-disk-cache --config=opt --strip=always \
            --@workerd//src/workerd/server:use_tcmalloc=False //src/workerd/server:workerd

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/bazel-disk-cache
          key: bazel-${{ env.VERSION }}-${{ github.run_id }}

      - name: Smoke test
        run: |
          cp bazel-bin/src/workerd/server/workerd workerd
          ./workerd --version
          ! grep -q "TCMalloc assumes" workerd
          gzip -9 -k workerd
          sha256sum workerd workerd.gz | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" workerd.gz SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "workerd $VERSION (linux arm64, no tcmalloc)" \
            --notes "workerd v$VERSION built for linux arm64 with --@workerd//src/workerd/server:use_tcmalloc=False, for kernels with a 39-bit virtual address space."
